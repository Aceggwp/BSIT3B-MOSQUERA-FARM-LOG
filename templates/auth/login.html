{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>
    Sign in - MOSQUERA Farm Logs
  </title>
  <link href="{% static 'libs/jsvectormap/dist/jsvectormap.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-flags.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-socials.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-payments.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-vendors.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-marketing.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-themes.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">

     <div class="card card-md">
      <div class="card-body">

        <center class="mt-n4">
        <span class="dh-brand-mark dh-brand-leaf" style="width:3rem;height:3rem;border-radius:.9rem;">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:1.7rem;height:1.7rem;">
            <path d="M12 2C7.5 7 4.5 11.5 4.5 15.5a7.5 7.5 0 0 0 7.5 7.5c4 0 7.5-3.5 7.5-7.5C19.5 11 16.5 6.5 12 2Z" fill="#4ade80"/>
            <path d="M12 5.5V20M12 10l-3.5-2M12 13.5 8 12M12 13.5l4-1.5M12 10l3.5-2" stroke="#166534" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="fw-bold mt-2">MOSQUERA <span class="text-primary">Farm Logs</span></div>
        </center>
        <h2 class="h3 text-center mb-4">Sign in to start your session</h2>

        <form method="post">
          {% csrf_token %}

          {% if messages %}
          {% for message in messages %}
          <div id="error-message" class="alert alert-danger">
            {{ message }}
          </div>
          {% endfor %}
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" autocomplete="off" {% if locked %}disabled{% endif %}>
          </div>
          <div class="mb-2">
            <label class="form-label">
              Password
            </label>
            <div class="input-group input-group-flat">
              <input type="password" class="form-control" name="password" autocomplete="off" {% if locked %}disabled{% endif %}>
            </div>
          </div>
          <div class="form-footer d-flex justify-content-end">
            <button type="submit" class="btn btn-primary w-50">
              <i class="fas fa-sign-in-alt me-1"></i> Sign in
            </button>
          </div>
       </form>
     </div>
   </div>
 </div>
 <div class="text-center text-secondary mt-n1">
  Don't have an account?
  <a href="{% url 'register' %}" class="text-primary fw-bold">Register</a>
 </div>
</div>

{% include 'theme/settings.html' %}

<script src="{% static 'js/tabler.js' %}" defer></script>
{% if locked %}
<script>
  let remaining = {{ remaining }};
  const messageBox = document.getElementById("error-message");

  let interval = setInterval(function() {
    remaining--;

    if (remaining > 0) {
      messageBox.innerHTML =
      "Too many failed attempts. Try again in " + remaining + " seconds.";
    } else {
      clearInterval(interval);
      window.location.href = "{% url 'login' %}";
    }

  }, 1000);
</script>
{% endif %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var themeConfig = {
      theme: "light",
      "theme-base": "gray",
      "theme-font": "sans-serif",
      "theme-primary": "blue",
      "theme-radius": "1",
    };

    var url = new URL(window.location);
    var form = document.getElementById("offcanvasSettings");
    var resetButton = document.getElementById("reset-changes");

    var checkItems = function () {
      for (var key in themeConfig) {
        var value =
        window.localStorage["tabler-" + key] || themeConfig[key];

        if (!!value) {
          var radios = form.querySelectorAll(`[name="${key}"]`);

          if (!!radios) {
            radios.forEach((radio) => {
              radio.checked = radio.value === value;
            });
          }
        }
      }
    };

    form.addEventListener("change", function (event) {
      var target = event.target,
      name = target.name,
      value = target.value;

      for (var key in themeConfig) {
        if (name === key) {
          document.documentElement.setAttribute("data-bs-" + key, value);
          window.localStorage.setItem("tabler-" + key, value);
          url.searchParams.set(key, value);
        }
      }

      window.history.pushState({}, "", url);
    });

    resetButton.addEventListener("click", function () {
      for (var key in themeConfig) {
        var value = themeConfig[key];
        document.documentElement.removeAttribute("data-bs-" + key);
        window.localStorage.removeItem("tabler-" + key);
        url.searchParams.delete(key);
      }

      checkItems();

      window.history.pushState({}, "", url);
    });

    checkItems();
  });
</script>
</body>
</html>
